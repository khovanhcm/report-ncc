<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tra cứu đơn hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;
  --bg:#F3F5F4; --ink:#14201C; --muted:#5E6B66; --line:#DCE2DF;
  --card:#FFFFFF; --card-ink:#14201C; --hmuted:#5E6B66; --accent:#0B6B5D; --on-accent:#FFFFFF; --soft:#EEF3F1;
  --good:#1F7A4D; --good-bg:#E3F3EA; --warn:#9A5B00; --warn-bg:#FFF1DC; --bad:#A33A2B; --bad-bg:#FBE6E2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;font-size:15px}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header h1{margin:4px 0 2px;font-size:1.7rem;line-height:1.2}
header .sub{color:var(--hmuted);font-size:.9rem}
header .eyebrow,footer{color:var(--hmuted)!important}
.card{background:var(--card);color:var(--card-ink);border:1px solid var(--line);border-radius:14px;padding:18px}
.search{margin-top:18px}
.search form{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 320px;font:inherit;font-size:1.05rem;padding:13px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--card-ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--card-ink);padding:10px 16px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:13px 26px;font-size:1rem}
.btn:disabled{opacity:.6;cursor:default}
.hint{font-size:.84rem;color:var(--muted);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--soft);color:var(--card-ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip b{font-weight:600}
#res{margin-top:18px;display:grid;gap:14px}
.po h2{margin:0;font-size:1.15rem}
.po .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;margin:12px 0 4px}
.po .meta div{font-size:.85rem}.po .meta span{display:block;color:var(--muted);font-size:.74rem}
.badge{display:inline-block;font-size:.76rem;font-weight:600;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:2px}
.b-good{background:var(--good-bg);color:var(--good)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-cnt{background:var(--soft);color:var(--muted)}
.bill{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.bill .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.bill .no{font-size:1.05rem;font-weight:700;letter-spacing:.02em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 6px;position:relative}
.step{text-align:center;position:relative;font-size:.78rem;color:var(--muted)}
.step:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--line)}
.step:first-child:before{display:none}
.step .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;background:var(--card);border:3px solid var(--line);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.step.done{color:var(--card-ink)}.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.done:before{background:var(--accent)}
.step.cur .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.step .t{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.dest{font-size:.84rem;color:var(--muted);margin-top:6px}
details{margin-top:8px}summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--accent)}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;margin:0 0 12px;padding-left:8px;font-size:.88rem}
.tl li:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--card)}
.tl li.first:before{background:var(--accent)}
.tl .tt{color:var(--muted);font-size:.8rem;margin-left:6px}
.pod{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pod img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft)}
.note{font-size:.8rem;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.load{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb button{position:absolute;top:14px;right:16px;font-size:1.6rem;background:none;border:0;color:#fff;cursor:pointer}
footer{margin-top:26px;font-size:.78rem;color:var(--muted);text-align:center}
@media (max-width:640px){.po .meta{grid-template-columns:repeat(2,1fr)}.step{font-size:.7rem}header h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Kho vận Hồ Chí Minh · Kinh doanh ngoài</div>
    <h1 id="ttl">Tra cứu đơn hàng</h1>
    <div class="sub" id="sub">Đang tải dữ liệu…</div>
  </header>

  <section class="card search">
    <form id="f" autocomplete="off">
      <input id="q" type="search" placeholder="Nhập mã PO hoặc mã vận đơn (bill)…" aria-label="Mã PO hoặc mã vận đơn" disabled>
      <button class="btn primary" id="go" disabled>Tra cứu</button>
    </form>
    <div class="hint">Có thể nhập nhiều mã, cách nhau bằng dấu phẩy hoặc khoảng trắng (tối đa 5 mã). Hành trình vận đơn lấy trực tiếp từ hệ thống vận chuyển.</div>
    <div class="chips" id="chips"></div>
  </section>

  <div id="res"></div>
  <footer id="foot"></footer>
</div>
<div class="lb" id="lb" role="dialog" aria-label="Ảnh giao hàng"><button aria-label="Đóng" id="lbx">✕</button><img id="lbi" alt="Ảnh giao hàng"></div>

<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbzRAMaclrPMA6xTRAS0ber2mcQk9YmSr3Fcre-MO2cbpNquWsgleVTP1Hh3Pzome1-R/exec';
var TRACK='https://tracuu-ncc.thanhquy11cdsh.workers.dev/';
var $=function(i){return document.getElementById(i)};
var P=new URLSearchParams(location.search),K=P.get('k')||'';
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var POS={},BILL2PO={},LC={},RECENT_KEY='tracuu-recent-'+K;

if(!K){$('sub').textContent='Link thiếu mã tra cứu. Vui lòng liên hệ Kho vận HCM.';return}

// Giao diện theo màu Kho vận đã chọn cho báo cáo
function lum(h){var n=parseInt(h.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ink(h){return lum(h)>.45?'#14201C':'#F4F6F5'}
function theme(t){if(!t)return;var R=document.documentElement.style;
  if(t.bg){R.setProperty('--bg',t.bg);R.setProperty('--ink',ink(t.bg));R.setProperty('--hmuted',lum(t.bg)>.45?'#5E6B66':'#C3C8D6')}
  if(t.card){R.setProperty('--card',t.card);R.setProperty('--card-ink',ink(t.card));R.setProperty('--muted',lum(t.card)>.45?'#565E6E':'#B9C2BE');R.setProperty('--line',lum(t.card)>.45?'rgba(0,0,0,.12)':'rgba(255,255,255,.16)')}
  if(t.tile)R.setProperty('--soft',t.tile);
  if(t.ac){R.setProperty('--accent',t.ac);R.setProperty('--on-accent',ink(t.ac))}
  if(t.font)R.setProperty('--font',t.font);
  if(t.size)document.body.style.fontSize=t.size+'px';
}

fetch(API+'?api=1&k='+encodeURIComponent(K)).then(function(r){return r.json()}).then(function(D){
  if(D.error){$('sub').textContent=D.error;return}
  theme(D.THEME);
  var dict=D.DICT||[],nccs=D.NCCS||[];
  (D.ROWS||[]).forEach(function(r){
    var po=r[2]||'',bill=r[4]||'';if(!po&&!bill)return;var key=po||bill;
    var o=POS[key]||(POS[key]={po:po,han:r[3],b:r[0],p:r[1],kho:r[10]<0?'':dict[r[10]],ncc:nccs[r[9]]||'',bills:[]});
    if(r[1]&&!o.p)o.p=r[1];
    if(bill&&o.bills.indexOf(bill)<0)o.bills.push(bill);
    if(bill)(BILL2PO[bill.toUpperCase()]=BILL2PO[bill.toUpperCase()]||[]).indexOf(key)<0&&BILL2PO[bill.toUpperCase()].push(key);
  });
  var name=D.NCC||'Tất cả NCC';
  document.title='Tra cứu đơn hàng · '+name;
  $('ttl').textContent='Tra cứu đơn hàng · '+name;
  $('sub').textContent='Dữ liệu đơn hàng cập nhật lúc '+(D.SNAP||'')+' · hành trình vận đơn tra trực tiếp khi bấm tìm';
  $('foot').textContent='Kho vận Hồ Chí Minh · Thông tin chỉ dành cho '+name+'. Mỗi vận đơn được làm mới sau tối đa 10 phút.';
  $('q').disabled=false;$('go').disabled=false;
  stats(D);recent();
  var q0=P.get('q');if(q0){$('q').value=q0;search(q0)}else $('q').focus();
}).catch(function(){$('sub').textContent='Không tải được dữ liệu. Vui lòng tải lại trang.'});

function stat(b){return (BILLSTATE[b]||'')}
var BILLSTATE={};
function stats(D){Object.keys(D.BILLS||{}).forEach(function(b){BILLSTATE[b]=D.BILLS[b]})}
$('chips').addEventListener('click',function(e){var c=e.target.closest('[data-q]');if(c){$('q').value=c.dataset.q;search(c.dataset.q);window.scrollTo({top:$('res').offsetTop-10,behavior:'smooth'})}});

function recent(){var r=[];try{r=JSON.parse(localStorage.getItem(RECENT_KEY))||[]}catch(e){}
  $('chips').innerHTML=r.length?'<span class="hint" style="margin:4px 4px 0 0">Tra gần đây:</span>'+r.map(function(x){return'<button class="chip" data-q="'+esc(x)+'">'+esc(x)+'</button>'}).join(''):''}
function remember(q){try{var r=JSON.parse(localStorage.getItem(RECENT_KEY))||[];r=[q].concat(r.filter(function(x){return x!==q})).slice(0,6);localStorage.setItem(RECENT_KEY,JSON.stringify(r))}catch(e){}}

$('f').addEventListener('submit',function(e){e.preventDefault();search($('q').value)});

function search(raw){
  var codes=String(raw||'').toUpperCase().split(/[\s,;]+/).filter(function(s){return s.length>=6}).slice(0,5);
  if(!codes.length){$('res').innerHTML='<div class="card empty">Vui lòng nhập mã PO hoặc mã vận đơn (ít nhất 6 ký tự).</div>';return}
  var found=[],miss=[];
  codes.forEach(function(c){
    var keys=[];
    Object.keys(POS).forEach(function(k){if(k.toUpperCase()===c)keys.push(k)});
    if(!keys.length&&BILL2PO[c])keys=BILL2PO[c];
    if(!keys.length)Object.keys(POS).forEach(function(k){if(keys.length<3&&k.toUpperCase().indexOf(c)>=0)keys.push(k)});
    if(!keys.length)Object.keys(BILL2PO).forEach(function(b){if(keys.length<3&&b.indexOf(c)>=0)BILL2PO[b].forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)})});
    if(keys.length)keys.forEach(function(k){if(found.indexOf(k)<0)found.push(k)});else miss.push(c);
  });
  remember(codes.join(', '));
  var h=found.slice(0,8).map(function(k){return poCard(POS[k])}).join('');
  if(miss.length)h+='<div class="card empty">Không tìm thấy: <b>'+miss.map(esc).join(', ')+'</b>. Vui lòng kiểm tra lại mã hoặc liên hệ Kho vận HCM.</div>';
  $('res').innerHTML=h;
  var bills=[];found.slice(0,8).forEach(function(k){POS[k].bills.forEach(function(b){if(bills.indexOf(b)<0)bills.push(b)})});
  live(bills.slice(0,10));
}

function lateBadge(o,lastDone){
  var m=/(\d+)\/(\d+)\/(\d{4})/.exec(o.han||'');if(!m)return'';
  var han=new Date(+m[3],m[2]-1,+m[1]),ref=lastDone||new Date(),d=Math.round((new Date(ref.getFullYear(),ref.getMonth(),ref.getDate())-han)/864e5);
  if(lastDone)return d>0?'<span class="badge b-bad">Giao trễ '+d+' ngày</span>':'<span class="badge b-good">Giao đúng hạn</span>';
  return d>0?'<span class="badge b-bad">Quá hạn PO '+d+' ngày</span>':'';
}
function poCard(o){
  return'<article class="card po" data-po="'+esc(o.po||o.bills[0])+'"><div class="eyebrow">Đơn hàng</div><h2>'+(o.po?'PO '+esc(o.po):'Vận đơn '+esc(o.bills[0]))+(o.ncc&&!window._one?'':'')+' <span data-late></span></h2>'
   +'<div class="meta"><div><span>Ngày booking</span>'+esc(o.b||'—')+'</div><div><span>Ngày lấy hàng</span>'+esc(o.p||'Chưa có')+'</div><div><span>Hạn PO</span>'+esc(o.han||'—')+'</div><div><span>Kho nhận</span>'+esc(o.kho||'—')+'</div></div>'
   +(o.bills.length?o.bills.map(function(b){return'<div class="bill" data-bill="'+esc(b)+'">'+billHTML(b)+'</div>'}).join(''):'<div class="bill note">Đơn hàng chưa có mã vận đơn.</div>')
   +'</article>';
}
var STEPS=[[1,'Khởi tạo'],[3,'Ở kho trung chuyển'],[4,'Đang đi đường'],[5,'Hoàn tất giao hàng']];
function fmt(t){var m=/(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(t||'');return m?m[4]+':'+m[5]+' '+m[3]+'/'+m[2]+'/'+m[1]:t}
function billHTML(b){
  var r=LC[b],s=BILLSTATE[b]||[];
  var head='<div class="top"><div><div class="eyebrow">Mã vận đơn</div><div class="no">'+esc(b)+'</div></div>';
  if(!r||r==='wait')return head+'<div class="note"><span class="load"></span>Đang tra hành trình…</div></div>';
  if(!r.ok)return head+'<span class="badge b-cnt">'+esc(s[0]||'Chưa có dữ liệu')+'</span></div><div class="note">Chưa tra được trực tiếp lúc này ('+esc(r.error||'lỗi')+'). Trạng thái hiển thị theo dữ liệu báo cáo. <button class="btn" data-retry="'+esc(b)+'">Thử lại</button></div>';
  var ev=r.events||[];if(!ev.length)return head+'<span class="badge b-cnt">Chưa có hành trình</span></div><div class="note">Hệ thống vận chuyển chưa ghi nhận hành trình cho vận đơn này.</div>';
  var last=ev[ev.length-1],id=last.id,done=id===5,badge=done?'b-good':(id===6||/hoàn|hủy|huỷ/i.test(last.s)&&!done)?'b-bad':'b-warn';
  var reach={};ev.forEach(function(e){reach[e.id]=e.t});
  var maxStep=0;STEPS.forEach(function(st,i){if(reach[st[0]]||(st[0]<=id&&id<=5))maxStep=i});
  var steps='<div class="steps">'+STEPS.map(function(st,i){var on=i<=maxStep&&id<=5;return'<div class="step'+(on?' done':'')+(i===maxStep&&!done&&on?' cur':'')+'"><div class="dot">'+(on?'✓':i+1)+'</div>'+st[1]+'<span class="t">'+(reach[st[0]]?esc(fmt(reach[st[0]])):'')+'</span></div>'}).join('')+'</div>';
  var imgs=[];ev.forEach(function(e){(e.img||[]).forEach(function(u){imgs.push(u)})});
  var tl=ev.slice().reverse().map(function(e,i){return'<li class="'+(i===0?'first':'')+'"><b>'+esc(e.s)+'</b><span class="tt">'+esc(fmt(e.t))+'</span>'+((e.img&&e.img.length)?'<div class="pod">'+e.img.map(function(u){return'<img src="'+esc(u)+'" data-big="'+esc(u)+'" alt="Ảnh giao hàng" loading="lazy">'}).join('')+'</div>':'')+'</li>'}).join('');
  return head+'<span class="badge '+badge+'">'+esc(last.s)+' · '+esc(fmt(last.t))+'</span></div>'+steps
    +(r.to?'<div class="dest">Giao đến: '+esc(r.to)+'</div>':'')
    +(imgs.length?'<div class="pod">'+imgs.slice(0,6).map(function(u){return'<img src="'+esc(u)+'" data-big="'+esc(u)+'" alt="Ảnh giao hàng" loading="lazy">'}).join('')+'</div>':'')
    +'<details><summary>Chi tiết hành trình ('+ev.length+' mốc)</summary><ol class="tl">'+tl+'</ol></details>'
    +'<div class="note">Tra trực tiếp lúc '+esc(r.at||'')+'</div>';
}
function paint(){document.querySelectorAll('[data-bill]').forEach(function(el){el.innerHTML=billHTML(el.dataset.bill)});
  document.querySelectorAll('article.po').forEach(function(a){var o=POS[a.dataset.po]||Object.values(POS).find(function(x){return x.bills[0]===a.dataset.po});if(!o)return;
    var all=o.bills.map(function(b){return LC[b]}),dones=[];
    all.forEach(function(r){if(r&&r.ok&&r.events&&r.events.length){var l=r.events[r.events.length-1];if(l.id===5){var m=/(\d{4})-(\d\d)-(\d\d)/.exec(l.t);if(m)dones.push(new Date(+m[1],m[2]-1,+m[3]))}}});
    var allDone=o.bills.length&&dones.length===o.bills.length;
    var el=a.querySelector('[data-late]');if(el)el.innerHTML=allDone?lateBadge(o,new Date(Math.max.apply(null,dones))):(o.bills.length&&all.every(function(r){return r&&r!=='wait'})?lateBadge(o,null):'')})}
function live(bills){
  bills=bills.filter(function(b){return!LC[b]||(LC[b]!=='wait'&&!LC[b].ok)});if(!bills.length){paint();return}
  bills.forEach(function(b){LC[b]='wait'});paint();
  for(var i=0;i<bills.length;i+=5)(function(part){
    fetch(TRACK+'?k='+encodeURIComponent(K)+'&track='+encodeURIComponent(part.join(','))).then(function(r){return r.json()}).then(function(d){
      part.forEach(function(b){LC[b]=(d&&d.ok&&d.bills&&d.bills[b.toUpperCase()])||{ok:false,error:(d&&d.error)||'không có phản hồi'}});paint()
    }).catch(function(){part.forEach(function(b){LC[b]={ok:false,error:'lỗi kết nối'}});paint()});
  })(bills.slice(i,i+5));
}
$('res').addEventListener('click',function(e){
  var r=e.target.closest('[data-retry]');if(r){LC[r.dataset.retry]=null;live([r.dataset.retry]);return}
  var im=e.target.closest('[data-big]');if(im){$('lbi').src=im.dataset.big;$('lb').style.display='flex'}
});
$('lb').addEventListener('click',function(e){if(e.target.id!=='lbi')$('lb').style.display='none'});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('lb').style.display='none'});
})();
</script>
</body>
</html>
